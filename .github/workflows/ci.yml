name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  linux-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-24.04]
        java-version: [21, 25]
        include:
          - os: ubuntu-26.04
            java-version: 27

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: Install clasp
        run: sudo apt-get update && sudo apt-get install -y clasp

      - name: Assemble Workcraft
        run: ./gradlew assemble

      - name: Run unit tests
        uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew test

      - name: Run integration tests
        uses: coactions/setup-xvfb@v1
        with:
          run: ./ci/run.sh


  windows-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            java-version: 21
          - os: windows-2025
            java-version: 25

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - name: Assemble Workcraft
        run: ./gradlew assemble

      - name: Run unit tests
        run: ./gradlew test

      - name: Run integration tests
        run: ./ci/run.sh
        shell: bash


  code-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run Checkstyle
        run: ./gradlew checkstyle

      - name: Run PMD checks
        run: ./gradlew pmd

      - name: Install clasp
        run: sudo apt-get update && sudo apt-get install -y clasp

      - name: Run unit tests with coverage analysis
        uses: coactions/setup-xvfb@v1
        with:
          run: ./gradlew coveralls

      - name: Integrate with coveralls
        uses: coverallsapp/github-action@v2
        with:
          format: jacoco

